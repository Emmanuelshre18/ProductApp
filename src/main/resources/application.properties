spring.application.name=ProductApp
server.port=8080


#DATABASE CONNECTION
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ProductApp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Expose error details for debugging (revert before production)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always